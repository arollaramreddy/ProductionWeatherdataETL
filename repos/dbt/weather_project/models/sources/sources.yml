version: 2

sources:
  - name: weatherstack
    database: "{{ env_var('DB_NAME', 'weather_db') }}"
    schema: weatherstack
    loaded_at_field: inserted_at
    freshness:
      warn_after:
        count: 2
        period: hour
      error_after:
        count: 12
        period: hour
    tables:
      - name: weather_data
        columns:
          - name: id
            tests:
              - not_null
              - unique
          - name: city
            tests:
              - not_null
          - name: temperature
            tests:
              - not_null
          - name: weather_description
          - name: wind_speed
          - name: time
            tests:
              - not_null
          - name: inserted_at
          - name: utc_offset
