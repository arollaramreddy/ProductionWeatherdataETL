services:
  database:
    container_name: postgres_container
    image: postgres:17
    ports:
    - 5001:5432
    environment:
      POSTGRES_DB: weather_db
      POSTGRES_USER: arollaramreddy
      POSTGRES_PASSWORD: weather_db_password
    volumes:
    - ./postgres/data:/var/lib/postgresql/data
    - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    networks:
    - my_network

  airflow:
    container_name: airflow_container
    image: apache/airflow:3.0.0
    ports:
    - 8000:8080
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://ram_airflow:airflow_password@database:5432/airflow_db
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: weather_db
      DB_USER: arollaramreddy
      DB_PASSWORD: weather_db_password
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./api_request:/opt/airflow/api_request
    - /Users/ramreddy/.docker/run/docker.sock:/var/run/docker.sock
    depends_on:
    - database
    networks:
    - my_network
    command: >
      bash -c "airflow db migrate && airflow standalone"

  dbt:
    container_name: dbt_container
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    platform: linux/amd64
    volumes:
      - ./dbt/weather_project:/usr/app
      - ./dbt:/root/.dbt
    working_dir: /usr/app
    depends_on:
      - database
    networks:
      - my_network
    command: run

  redis:
    container_name: redis_container
    image: redis:7-alpine
    networks:
      - my_network

  superset-init:
    container_name: superset_init_container
    build:
      context: ./superset
    environment:
      SUPERSET_SECRET_KEY: change-this-to-a-long-random-production-secret
      SUPERSET_METADATA_DB_URI: postgresql+psycopg2://superset:superset_password@database:5432/superset_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - database
      - redis
    networks:
      - my_network
    command: >
      bash -c "superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@example.com --password admin || true &&
      superset init"

  superset:
    container_name: superset_container
    build:
      context: ./superset
    ports:
      - 8088:8088
    environment:
      SUPERSET_SECRET_KEY: change-this-to-a-long-random-production-secret
      SUPERSET_METADATA_DB_URI: postgresql+psycopg2://superset:superset_password@database:5432/superset_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_started
      superset-init:
        condition: service_completed_successfully
    networks:
      - my_network
    command: >
      gunicorn --bind 0.0.0.0:8088 --workers 2 --worker-class gthread
      --threads 8 --timeout 120 "superset.app:create_app()"







networks: 
  my_network:
    driver: bridge
